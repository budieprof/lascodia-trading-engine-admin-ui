<!-- Right-click menu on a drawing. -->
@if (drawingMenu(); as dm) {
  @if (drawingById(dm.id); as dd) {
    <div
      class="context-menu drawing-menu"
      role="menu"
      [style.left.px]="dm.x"
      [style.top.px]="dm.y"
      (pointerdown)="$event.stopPropagation()"
    >
      <button type="button" (click)="act(dd.id, 'settings')">
        <app-chart-icon name="settings" [size]="20" />Settings…
      </button>
      <div class="menu-sep"></div>
      <button type="button" (click)="act(dd.id, 'clone')">
        <app-chart-icon name="clone" [size]="20" />Clone
      </button>
      <button type="button" (click)="act(dd.id, 'copy')"><span class="mi-blank"></span>Copy</button>
      <button type="button" (click)="act(dd.id, 'hide')">
        <app-chart-icon name="eye-off" [size]="20" />Hide
      </button>
      <button type="button" (click)="act(dd.id, 'lock')">
        <app-chart-icon [name]="dd.locked ? 'unlock' : 'lock'" [size]="20" />{{
          dd.locked ? 'Unlock' : 'Lock'
        }}
      </button>
      <div class="menu-sep"></div>
      <div class="submenu-host">
        <button type="button" class="has-sub">
          <app-chart-icon name="layers" [size]="20" />Visual order<span class="sub-caret">›</span>
        </button>
        <div class="context-menu submenu" role="menu">
          <button type="button" (click)="act(dd.id, 'front')">
            <app-chart-icon name="bring-front" [size]="20" />Bring to front
          </button>
          <button type="button" (click)="act(dd.id, 'forward')">
            <span class="mi-blank"></span>Bring forward
          </button>
          <button type="button" (click)="act(dd.id, 'backward')">
            <span class="mi-blank"></span>Send backward
          </button>
          <button type="button" (click)="act(dd.id, 'back')">
            <app-chart-icon name="send-back" [size]="20" />Send to back
          </button>
        </div>
      </div>
      <div class="menu-sep"></div>
      <button type="button" class="danger" (click)="act(dd.id, 'remove')">
        <app-chart-icon name="trash" [size]="20" />Remove
      </button>
    </div>
  }
}

@if (settingsFor(); as sid) {
  <app-drawing-settings-dialog
    [drawingId]="sid"
    [resolutions]="resolutions"
    (closed)="settingsFor.set(null)"
  />
}

@if (contextMenu(); as cm) {
  <div class="context-menu" [style.left.px]="cm.x" [style.top.px]="cm.y">
    <button type="button" (click)="resetScales.emit()">Reset scales</button>
    <button
      type="button"
      role="menuitemcheckbox"
      [attr.aria-checked]="invertScale()"
      (click)="invertScale.set(!invertScale()); closeMenu.emit()"
    >
      {{ invertScale() ? '✓ ' : '' }}Invert scale
    </button>
    <button
      type="button"
      role="menuitemcheckbox"
      [attr.aria-checked]="scaleMode() === 'indexed'"
      (click)="scaleMode.set(scaleMode() === 'indexed' ? 'normal' : 'indexed'); closeMenu.emit()"
    >
      {{ scaleMode() === 'indexed' ? '✓ ' : '' }}Indexed to 100
    </button>
    <button
      type="button"
      (click)="scaleSide.set(scaleSide() === 'right' ? 'left' : 'right'); closeMenu.emit()"
    >
      Move scale to the {{ scaleSide() === 'right' ? 'left' : 'right' }}
    </button>
    <button
      type="button"
      role="menuitemcheckbox"
      data-testid="countdown-toggle"
      [attr.aria-checked]="showCountdown()"
      (click)="showCountdown.set(!showCountdown()); closeMenu.emit()"
    >
      {{ showCountdown() ? '✓ ' : '' }}Countdown to bar close
    </button>
    <button type="button" (click)="chartSettings.emit()">Settings…</button>
    <button type="button" (click)="commands.emit()" title="⌘⇧K">Commands…</button>
    <button type="button" (click)="saveImage.emit()">Save image…</button>
    <button type="button" (click)="copyImage.emit()">Copy image</button>
    <button type="button" (click)="exportData.emit()">Export chart data (CSV)</button>
    <button type="button" (click)="showObjects.emit()">Show objects</button>
    <button type="button" (click)="addIndicator.emit()">Add indicator…</button>
    @if (cm.level; as lvl) {
      <button type="button" (click)="alertAtLevel.emit($event)" data-testid="alert-at-level">
        Add alert at {{ lvl.label }}
        {{ lvl.price | number: '1.' + precision() + '-' + precision() }}
      </button>
    }
    @if (cm.price !== null) {
      <button type="button" (click)="alertHere.emit($event)">
        Add alert at {{ cm.price | number: '1.' + precision() + '-' + precision() }}
      </button>
    }
    <button type="button" (click)="saveLayoutAs.emit()">Save layout as…</button>
    <button
      type="button"
      class="danger"
      (click)="removeAllDrawings.emit()"
      [disabled]="!drawings.visible().length"
    >
      Remove all drawings
    </button>
    <button type="button" (click)="closeMenu.emit()">Close</button>
  </div>
}
