server {
    # Unprivileged nginx (uid 101) cannot bind below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Long-cache hashed bundles; never cache index/config.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
    location = /config.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback: all client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip text responses.
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Favour brotli if the module is compiled into the nginx image.
    # (alpine image doesn't ship brotli by default; uncomment if upgrading.)
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;
}
