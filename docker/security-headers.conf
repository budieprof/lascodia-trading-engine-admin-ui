# Security headers for every response of the console image (included at server level AND in every location that sets
# its own add_header: nginx drops inherited add_header directives in a block that declares any — before 2026-11-01
# index.html, config.json and every bundle file were served WITHOUT the CSP for exactly that reason).
#
# The same policy as the public Caddy site (gaps program security). The production build emits no inline script
# (angular.json: optimization.styles.inlineCritical=false), so script-src is 'self' only. style-src keeps
# 'unsafe-inline': Angular inserts component styles as <style> elements and the charting / editor widgets set inline
# styles; a nonce needs per-request templating this static server does not do.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
